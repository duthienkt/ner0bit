; Ner0bit firmware — ESP32-C3 Super Mini
[platformio]
default_envs = esp32c3

; Board ID: esp32-c3-devkitm-1 (tương thích Super Mini)
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Super Mini dùng USB-native (không có chip UART riêng)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Nạp từ macOS. Wildcard: số sau "usbmodem" đổi theo cổng USB đang cắm.
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200

; Unit test chạy trên máy host (lib/core không được include Arduino/ESP)
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
